<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo de Traslados</title>
<style>
  :root{
    --bg:#0A1520;
    --bg2:#0D1B2A;
    --card:#122132;
    --card-alt:#16283C;
    --border:#1F3347;
    --lime:#A8E00A;
    --lime-dim:#7FAE08;
    --blue:#3B82F6;
    --amber:#F5A623;
    --red:#EF4444;
    --green:#22C55E;
    --text:#FFFFFF;
    --text-dim:#8CA0B3;
    --text-dim2:#5E7488;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--bg2);
    border-radius:28px;
    border:1px solid #1a2c3d;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
    min-height:820px;
    max-height:860px;
    display:flex;
    flex-direction:column;
  }
  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px 18px;
    flex-shrink:0;
  }
  .icon-btn{
    color:var(--lime); font-size:20px; background:none; border:none; cursor:pointer;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  }
  .title{
    font-size:19px; font-weight:700; letter-spacing:.2px;
  }
  .menu-lines{
    color:var(--lime); font-size:20px; cursor:pointer;
  }

  /* Tabs */
  .tabs{
    display:flex; margin:0 16px 14px 16px;
    background:var(--card);
    border-radius:14px; padding:4px; gap:4px;
    flex-shrink:0;
  }
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:11px;
    font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer;
    transition:.15s;
  }
  .tab.active{ background:var(--lime); color:#0A1520; }

  .segment-tabs{
    display:flex; margin-bottom:14px;
    background:var(--card-alt);
    border-radius:14px; padding:4px; gap:4px;
  }
  .segment-tab{
    flex:1; text-align:center; padding:8px 4px; border-radius:11px;
    font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;
    transition:.15s;
  }
  .segment-tab.on{ background:var(--lime); color:#0A1520; }

  .content{ padding:0 16px 24px 16px; overflow-y:auto; flex:1; }

  /* Filters: envuelven en varias líneas, nunca se salen de pantalla ni requieren scroll horizontal */
  .filters{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .chip{
    white-space:nowrap; font-size:12.5px; font-weight:600; color:var(--blue);
    border:1px solid var(--blue); border-radius:20px; padding:7px 13px;
    display:flex; align-items:center; gap:6px; cursor:pointer; background:rgba(59,130,246,.08);
  }
  .chip.on{ background:var(--blue); color:#fff; }

  /* Breadcrumbs jerarquía (región / zona / tienda) */
  .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:-2px 0 10px 2px; font-size:11.5px; }
  .crumb{ color:var(--text-dim); cursor:pointer; font-weight:600; }
  .crumb.active{ color:var(--lime); font-weight:800; cursor:default; }
  .crumb-sep{ color:var(--text-dim2); margin:0 1px; }
  .level-hint{ font-weight:400; color:var(--text-dim); font-size:11px; }

  /* KPI grid - 3 columnas */
  .kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 10px;
  }
  .kpi .k-label{ display:flex; align-items:center; gap:4px; color:var(--text-dim); font-size:10.5px; margin-bottom:8px; line-height:1.25;}
  .kpi .k-value{ font-size:21px; font-weight:800; }
  .kpi .k-sub{ font-size:10px; margin-top:5px; font-weight:600; line-height:1.3; }
  .up-red{ color:var(--red); }
  .up-green{ color:var(--green); }
  .up-amber{ color:var(--amber); }
  .pvp-highlight{ color:#FFD84D; font-weight:800; font-size:11px; margin-top:2px; }
  .k-sub-units{ font-size:9.5px; color:var(--text-dim); font-weight:600; margin-top:1px; }

  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim);
    margin:18px 0 10px 2px; font-weight:700;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .see-all{ color:var(--lime); font-size:11px; text-transform:none; letter-spacing:0; cursor:pointer; font-weight:700;}

  /* bars ranking - ahora clickeable */
  .rank-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:16px;}
  .rank-row{ margin-bottom:14px; cursor:pointer; padding:6px 4px; border-radius:10px; transition:.15s; margin-left:-4px; margin-right:-4px; }
  .rank-row:active{ background:rgba(168,224,10,.08); }
  .rank-row:last-child{ margin-bottom:0; }
  .rank-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px;}
  .rank-name{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .rank-name .chev{ color:var(--text-dim2); font-size:12px; }
  .rank-stats{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .stat-item{ font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:4px; }
  .stat-item b{ color:var(--text); font-weight:800; font-size:12px; }
  .stat-pend b{ color:var(--lime); }
  .stat-transito b{ color:var(--blue); }
  .bar-bg{ height:6px; background:#1E3247; border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--lime); border-radius:4px; }
  .bar-fill.alert{ background:var(--red); }

  /* ---- Lista compacta (rows) ---- */
  .list-sticky{
    position:sticky; top:0; background:var(--bg2); z-index:5; padding-top:2px; padding-bottom:10px;
  }
  .sticky-summary{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; margin-bottom:10px; font-size:12px;
  }
  .sticky-summary .s-total{ color:var(--text-dim); }
  .sticky-summary .s-total b{ color:var(--text); font-weight:800; }
  .sticky-summary .s-alert{ display:flex; align-items:center; gap:6px; color:var(--red); font-weight:700; }
  .dot-red{ width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; }

  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-input{
    width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px 10px 34px; color:var(--text); font-size:13px; outline:none;
  }
  .search-input:focus{ border-color:var(--lime-dim); }
  .search-input::placeholder{ color:var(--text-dim2); }
  .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-dim2); font-size:13px; pointer-events:none; }

  .sort-row{ display:flex; gap:8px; margin-bottom:2px; }
  .sort-chip{
    font-size:11.5px; font-weight:700; color:var(--text-dim); background:var(--card);
    border:1px solid var(--border); border-radius:20px; padding:6px 12px; cursor:pointer;
  }
  .sort-chip.on{ background:var(--lime); color:#0A1520; border-color:var(--lime); }

  .thresh-row{ display:flex; gap:8px; margin-bottom:12px; }
  .thresh-chip{
    font-size:11.5px; font-weight:700; color:var(--text-dim); background:var(--card);
    border:1px solid var(--border); border-radius:20px; padding:6px 12px; cursor:pointer;
  }
  .thresh-chip.on{ background:var(--red); color:#fff; border-color:var(--red); }
  .thresh-chip.thresh-warn.on{ background:var(--amber); border-color:var(--amber); color:#0A1520; }
  .thresh-chip.thresh-ok.on{ background:var(--green); border-color:var(--green); color:#0A1520; }

  .rows-wrap{ margin-top:6px; }
  .row-item{
    display:flex; align-items:center; gap:10px; padding:12px 4px; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .row-item:active{ background:rgba(255,255,255,.02); }
  .row-item:last-child{ border-bottom:none; }
  .row-bar{ width:4px; align-self:stretch; border-radius:3px; background:var(--text-dim2); flex-shrink:0; min-height:34px; }
  .row-bar.ok{ background:var(--green); }
  .row-bar.warn{ background:var(--amber); }
  .row-bar.alert{ background:var(--red); }
  .row-bar.transito{ background:var(--blue); }
  .row-main{ flex:1; min-width:0; }
  .row-route{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-route .arrow{ color:var(--lime); margin:0 4px; font-weight:400; }
  .row-meta{ font-size:11px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .row-chevron{ color:var(--text-dim2); font-size:15px; }

  .days-tag{ font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:8px; white-space:nowrap; }
  .days-ok{ background:rgba(34,197,94,.15); color:var(--green); }
  .days-warn{ background:rgba(245,166,35,.15); color:var(--amber); }
  .days-alert{ background:rgba(239,68,68,.18); color:var(--red); }
  .days-neutral{ background:rgba(59,130,246,.15); color:var(--blue); }

  /* Bodega view */
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; cursor:pointer; }
  .back-row span{ color:var(--lime); font-size:13.5px; font-weight:700; }

  .bodega-hero{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px;
  }
  .bodega-hero .b-name{ font-size:17px; font-weight:800; margin-bottom:2px; }
  .bodega-hero .b-sub{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .bodega-mini-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .bodega-mini{ background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; }
  .bodega-mini .m-val{ font-size:18px; font-weight:800; }
  .bodega-mini .m-lbl{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; margin-top:3px; letter-spacing:.3px; }

  /* Detail view */
  .detail-card{
    background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:18px;
  }
  .detail-route{ font-size:18px; font-weight:800; margin-bottom:4px; }
  .detail-sub{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  .detail-grid .lbl{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; }
  .detail-grid .val{ font-size:13.5px; font-weight:700; margin-top:3px; }

  .ver-detalle-btn{
    width:100%; margin-top:16px; background:var(--bg2); border:1px solid var(--lime-dim);
    color:var(--lime); font-size:13px; font-weight:700; padding:10px; border-radius:12px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .contenido-panel{ margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .prod-header{
    display:grid; grid-template-columns:1fr 2fr auto; gap:8px; font-size:10px;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; padding:0 4px 6px 4px;
  }
  .prod-row{
    display:grid; grid-template-columns:1fr 2fr auto; gap:8px; align-items:center;
    padding:8px 4px; border-bottom:1px solid var(--border); font-size:12.5px;
  }
  .prod-row:last-child{ border-bottom:none; }
  .prod-sku{ color:var(--text-dim); font-weight:600; }
  .prod-nombre{ font-weight:600; }
  .prod-cant{ font-weight:800; color:var(--lime); text-align:right; }

  /* Timeline */
  .timeline{ position:relative; padding-left:30px; }
  .tl-item{ position:relative; padding-bottom:26px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{
    position:absolute; left:-30px; top:2px; width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
    border:2px solid var(--border); background:var(--card);
  }
  .tl-item.done .tl-dot{ background:var(--lime); border-color:var(--lime); color:#0A1520; }
  .tl-item.current .tl-dot{ background:var(--card); border-color:var(--lime); color:var(--lime); box-shadow:0 0 0 4px rgba(168,224,10,.15); }
  .tl-item.pending .tl-dot{ background:var(--card); border-color:var(--text-dim2); color:var(--text-dim2); }
  .tl-line{
    position:absolute; left:-21px; top:20px; width:2px; height:calc(100% - 8px);
    background:var(--border);
  }
  .tl-item.done .tl-line{ background:var(--lime-dim); }
  .tl-item:last-child .tl-line{ display:none; }
  .tl-title{ font-size:14px; font-weight:700; }
  .tl-item.pending .tl-title{ color:var(--text-dim); }
  .tl-meta{ font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5; }
  .tl-item.pending .tl-meta{ color:var(--text-dim2); }
  .tl-status{ display:inline-block; font-size:10.5px; font-weight:700; margin-top:6px; padding:3px 8px; border-radius:6px; }
  .tl-status.wait{ background:rgba(245,166,35,.15); color:var(--amber); }

  .alert-box{
    background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.4); border-radius:14px;
    padding:12px 14px; margin-top:18px; display:flex; gap:10px; align-items:flex-start;
  }
  .alert-box .a-icon{ color:var(--red); font-size:16px; }
  .alert-box .a-text{ font-size:12.5px; color:#FCA5A5; line-height:1.5; }
  .alert-box .a-text b{ color:var(--red); }

  .empty-note{ text-align:center; color:var(--text-dim2); font-size:12.5px; padding:30px 10px; }
</style>
</head>

let currentSegment = null; // null = pantalla raíz combinada | 'tiendas' | 'administrativo' | 'cedi'

function combinedList(){
  return TRASLADOS.concat(TRASLADOS_ADMIN, TRASLADOS_CEDI);
}

let currentTab = "dash";
let currentDetailId = null;
let currentBodega = null;
let previousTab = "dash";
let searchQuery = "";
let sortOrder = "old"; // 'old' = más antiguo primero (más días), 'new' = más reciente primero
let minDiasDash = 10; // umbral activo en el Dashboard (afecta jerarquía + atrasados + bodega). null = todos
let minDiasList = null; // umbral activo en la Lista. null = mostrar todo por defecto

/* ---------- Navegación jerárquica, adaptada al segmento activo ----------
   Tiendas: Regional → Ciudad → Zona (Jefe) → Bodega
   Administrativo / CEDI: Ciudad → Coordinación → Bodega */
const LEVELS_TIENDAS = ["regional","zona","bodega"];
const LEVELS_CATALOGO = ["coordinacion","bodega"];
let drillPath = []; // [{level:'regional', value:'Reg Centro'}, {level:'ciudad', value:'BOGOTA'}, ...]

function activeLevels(){
  return currentSegment === "tiendas" ? LEVELS_TIENDAS : LEVELS_CATALOGO;
}
function currentDrillLevel(){
  const levels = activeLevels();
  return levels[Math.min(drillPath.length, levels.length - 1)];
}
function drillFilteredTraslados(){
  let list = scopedTraslados();
  drillPath.forEach(step=>{
    if(step.level === "regional") list = list.filter(t => t.regional === step.value);
    if(step.level === "ciudad") list = list.filter(t => t.ciudad === step.value);
    if(step.level === "zona") list = list.filter(t => t.zona === step.value);
    if(step.level === "coordinacion") list = list.filter(t => t.coordinacion === step.value);
  });
  return list;
}
function buildGroups(list, level){
  const keyFn = level==="regional" ? t=>t.regional
    : level==="ciudad" ? t=>t.ciudad
    : level==="zona" ? t=>t.zona
    : level==="coordinacion" ? t=>t.coordinacion
    : t=>t.destino;
  const map = {};
  list.forEach(t=>{
    const k = keyFn(t);
    if(!map[k]) map[k] = {name:k, total:0, pend:0, alert:0, transito:0};
    map[k].total++;
    if(t.estado === "pend_consolidar"){ map[k].pend++; if(t.dias >= 10) map[k].alert++; }
    if(t.estado === "en_transito") map[k].transito++;
  });
  return Object.values(map).sort((a,b)=> b.pend - a.pend || b.total - a.total);
}
function drillInto(name){
  const level = currentDrillLevel();
  if(level === "bodega"){ openBodega(name); return; }
  drillPath.push({level, value:name});
  render();
}
function crumbClick(idx){
  drillPath = idx < 0 ? [] : drillPath.slice(0, idx+1);
  render();
}
function renderHierarchyExplorer(){
  const level = currentDrillLevel();
  const list = drillFilteredTraslados().filter(t => passesThreshold(t, minDiasDash));
  const groups = buildGroups(list, level);
  const maxPend = Math.max(1, ...groups.map(g=>g.pend));

  const rootLabel = currentSegment === "tiendas" ? "Todas las regionales" : currentSegment === "administrativo" ? "Todo Administrativo" : "Todo CEDI";
  const crumbs = [{label: rootLabel}].concat(drillPath.map(d=>({label:d.value})));
  const crumbsHTML = `<div class="crumbs">` + crumbs.map((c,i)=>{
    const isActive = i === crumbs.length - 1;
    const clickIdx = i - 1;
    return `<span class="crumb ${isActive?'active':''}" onclick="crumbClick(${clickIdx})">${c.label}</span>` +
           (i < crumbs.length - 1 ? `<span class="crumb-sep">›</span>` : "");
  }).join("") + `</div>`;

  const levelTitle = level === "regional" ? "Regionales" : level === "ciudad" ? "Ciudades" : level === "zona" ? "Zonas (Jefes)" : level === "coordinacion" ? "Coordinación" : "Bodegas";
  const rowsHTML = groups.length ? groups.map(g => `
    <div class="rank-row" onclick="drillInto('${g.name.replace(/'/g,"\\'")}')">
      <div class="rank-top">
        <div class="rank-name">${g.name} <span class="chev">›</span></div>
      </div>
      <div class="rank-stats">
        <span class="stat-item stat-pend">📦 <b>${g.pend}</b> por consolidar</span>
        <span class="stat-item stat-transito">🚚 <b>${g.transito}</b> en tránsito</span>
      </div>
      <div class="bar-bg"><div class="bar-fill ${g.alert>0?'alert':''}" style="width:${(g.pend/maxPend)*100}%"></div></div>
    </div>
  `).join("") : `<div class="empty-note">No hay traslados en este nivel.</div>`;

  return `
    <div class="section-title">${levelTitle} <span class="level-hint">sin consolidar</span></div>
    ${crumbsHTML}
    <div class="rank-card">${rowsHTML}</div>
  `;
}

function scopedTraslados(){
  if(currentSegment === "administrativo") return TRASLADOS_ADMIN;
  if(currentSegment === "cedi") return TRASLADOS_CEDI;
  if(currentSegment === "tiendas") return TRASLADOS;
  return combinedList();
}
function pendientes(list){
  return (list || scopedTraslados()).filter(t => t.estado === "pend_consolidar");
}
function dayClass(t){
  if(t.estado !== "pend_consolidar") return "transito";
  if(t.dias >= 10) return "alert";
  if(t.dias >= 5) return "warn";
  return "ok";
}
function dayBadgeClass(t){
  if(t.estado !== "pend_consolidar") return "days-neutral";
  if(t.dias>=10) return "days-alert";
  if(t.dias>=5) return "days-warn";
  return "days-ok";
}
function estadoLabel(t){
  if(t.estado === "pend_despacho") return "Sin despachar";
  if(t.estado === "pend_consolidar") return "Pend. consolidar";
  if(t.estado === "en_transito") return "En tránsito";
  return "Recepcionado";
}

function toggleContenido(){
  const panel = document.getElementById("contenidoPanel");
  const chevron = document.getElementById("contenidoChevron");
  if(!panel) return;
  const abierto = panel.style.display !== "none";
  panel.style.display = abierto ? "none" : "block";
  if(chevron) chevron.textContent = abierto ? "›" : "︿";
}

function updateTabsUI(){
  document.getElementById("tabDash").classList.toggle("active", currentTab==="dash");
  document.getElementById("tabList").classList.toggle("active", currentTab==="list");
  document.getElementById("tabBodega").classList.toggle("active", currentTab==="bodega");
  document.getElementById("tabDet").classList.toggle("active", currentTab==="detail");
  document.getElementById("tabBodega").style.display = (currentTab === "bodega") ? "block" : "none";
  document.getElementById("tabDet").style.display = (currentTab === "detail") ? "block" : "none";
  document.getElementById("topBack").style.visibility = (currentTab==="dash" && drillPath.length===0 && currentSegment===null) ? "hidden" : "visible";
}

function showTab(t){
  currentTab = t;
  updateTabsUI();
  searchQuery = "";
  render();
}

function handleTopBack(){
  if(currentTab === "detail"){ showTab(previousTab); return; }
  if(currentTab === "bodega"){ showTab("dash"); return; }
  if(currentTab === "list"){ showTab("dash"); return; }
  if(currentTab === "dash"){
    if(drillPath.length > 0){ drillPath.pop(); render(); return; }
    if(currentSegment !== null){ currentSegment = null; render(); return; }
  }
}

function openDetail(id){
  previousTab = currentTab;
  currentDetailId = id;
  currentTab = "detail";
  document.getElementById("tabDet").style.display = "block";
  updateTabsUI();
  render();
}

function openBodega(nombre){
  currentBodega = nombre;
  currentTab = "bodega";
  document.getElementById("tabBodega").style.display = "block";
  updateTabsUI();
  searchQuery = "";
  render();
}

function getFilteredSorted(list, minVal){
  let out = list.filter(t => passesThreshold(t, minVal));
  if(searchQuery.trim()){
    const q = searchQuery.toLowerCase();
    out = out.filter(t =>
      t.id.toLowerCase().includes(q) ||
      t.origen.toLowerCase().includes(q) ||
      t.destino.toLowerCase().includes(q)
    );
  }
  out = [...out].sort((a,b)=> sortOrder === "old" ? b.dias - a.dias : a.dias - b.dias);
  return out;
}

function onSearchInput(v){
  searchQuery = v;
  updateRows();
}
function setSort(o){
  sortOrder = o;
  if(currentTab === "bodega") updateRowsBodega();
  else updateRows();
  const chipOld = document.getElementById("sortOld");
  const chipNew = document.getElementById("sortNew");
  if(chipOld && chipNew){
    chipOld.classList.toggle("on", o==="old");
    chipNew.classList.toggle("on", o==="new");
  }
}

function setMinDiasDash(v){
  minDiasDash = v;
  render();
}
function setMinDiasList(v){
  minDiasList = v;
  const valStr = v===null ? "all" : String(v);
  document.querySelectorAll(".thresh-chip").forEach(el=>{
    el.classList.toggle("on", el.getAttribute("data-val") === valStr);
  });
  updateRows();
}

function thresholdChipsHTML(view){
  const current = view === "dash" ? minDiasDash : minDiasList;
  const setter = view === "dash" ? "setMinDiasDash" : "setMinDiasList";
  return `
    <div class="thresh-row">
      <div class="thresh-chip ${current===null?'on':''}" data-val="all" onclick="${setter}(null)">Todos</div>
      <div class="thresh-chip thresh-alert ${current===10?'on':''}" data-val="10" onclick="${setter}(10)">10+ días</div>
      <div class="thresh-chip thresh-warn ${current===5?'on':''}" data-val="5" onclick="${setter}(5)">5-9 días</div>
      <div class="thresh-chip thresh-ok ${current===2?'on':''}" data-val="2" onclick="${setter}(2)">2-4 días</div>
    </div>
  `;
}

function passesThreshold(t, minVal){
  if(minVal === null) return true;
  if(minVal === 10) return t.dias >= 10;
  if(minVal === 5) return t.dias >= 5 && t.dias < 10;
  return t.dias >= 2 && t.dias < 5;
}

function rowItemHTML(t){
  return `
    <div class="row-item" onclick="openDetail('${t.id}')">
      <div class="row-bar ${dayClass(t)}"></div>

        <div class="row-route">${t.origen}<span class="arrow">→</span>${t.destino}</div>
        <div class="row-meta">${t.id} · ${t.tipo} · ${t.paquetes} pzas</div>
      </div>
      <div class="row-right">
        <span class="days-tag ${dayBadgeClass(t)}">${t.estado==='pend_consolidar' ? t.dias+'d' : estadoLabel(t)}</span>
        <span class="row-chevron">›</span>
      </div>
    </div>
  `;
}

    <div class="segment-tabs">
      <div class="segment-tab ${currentSegment==='tiendas'?'on':''}" onclick="setSegment('tiendas')">Tiendas</div>

    </div>

  const segs = [
    {key:"tiendas", list: TRASLADOS},
    {key:"administrativo", list: TRASLADOS_ADMIN},
    {key:"cedi", list: TRASLADOS_CEDI},
  ];
  const segsFiltered = segs.map(s => ({key:s.key, list: s.list.filter(t=>passesThreshold(t, minDiasDash))}));
  const maxPend = Math.max(1, ...segsFiltered.map(s=>s.list.filter(t=>t.estado==="pend_consolidar").length));
  const rowsHTML = segsFiltered.map(s=>{
    const pendList = s.list.filter(t=>t.estado==="pend_consolidar");
    const pend = pendList.length;
    const transito = s.list.filter(t=>t.estado==="en_transito").length;
    const alert = pendList.filter(t=>t.dias>=10).length;
    return `
      <div class="rank-row" onclick="selectSegment('${s.key}')">
        <div class="rank-top">
          <div class="rank-name">${s.key==='tiendas'?'Tiendas':s.key==='administrativo'?'Administrativo':'CEDI'} <span class="chev">›</span></div>
        </div>
        <div class="rank-stats">
          <span class="stat-item stat-pend">📦 <b>${pend}</b> por consolidar</span>
          <span class="stat-item stat-transito">🚚 <b>${transito}</b> en tránsito</span>
        </div>
        <div class="bar-bg"><div class="bar-fill ${alert>0?'alert':''}" style="width:${(pend/maxPend)*100}%"></div></div>
      </div>
    `;
  }).join("");
  return `
    <div class="section-title">Segmentos</div>
    <div class="rank-card">${rowsHTML}</div>
  `;
}

function renderDashboardRoot(){
  const all = combinedList();
  const pend = all.filter(t => t.estado === "pend_consolidar");
  const avgDias = pend.length ? Math.round(pend.reduce((a,t)=>a+t.dias,0)/pend.length) : 0;

  const pendFiltrado = pend.filter(t=>passesThreshold(t, minDiasDash));
  const pvpTotal = pendFiltrado.reduce((sum,t)=>sum+t.valorMercancia,0);
  const unidadesTotal = pendFiltrado.reduce((sum,t)=>sum+(t.productos||[]).reduce((s,p)=>s+p.cantidad,0),0);
  const transitoFiltrado = all.filter(t=>t.estado==='en_transito' && passesThreshold(t, minDiasDash));

  let html = `
    <div class="kpi-grid">
      <div class="kpi">
        <div class="k-label">📦 Sin consolidar</div>
        <div class="k-value">${pendFiltrado.length}</div>
        <div class="k-sub pvp-highlight">$${pvpTotal.toLocaleString('es-CO')}</div>
        <div class="k-sub-units">${unidadesTotal} und</div>
      </div>
      <div class="kpi">
        <div class="k-label">🚚 En tránsito</div>
        <div class="k-value">${transitoFiltrado.length}</div>
        <div class="k-sub up-green">hacia destino</div>
      </div>
      <div class="kpi">
        <div class="k-label">⏱ Prom. días pend.</div>
        <div class="k-value">${avgDias}d</div>
        <div class="k-sub ${avgDias>=10?'up-red':avgDias>=5?'up-amber':'up-green'}">tiempo promedio</div>
      </div>
    </div>
    ${thresholdChipsHTML('dash')}
  `;
  html += segmentListHTML();
  html += `
    <div class="section-title">Traslados atrasados <span class="see-all" onclick="showTab('list')">Ver todos ›</span></div>
    <div class="rows-wrap">
  `;
  const filteredAtrasados = [...pendFiltrado].sort((a,b)=>b.dias-a.dias);
  const top3 = filteredAtrasados.slice(0,3);
  html += top3.length ? top3.map(rowItemHTML).join("") : `<div class="empty-note">Ningún traslado en este rango de días 🎉</div>`;
  html += `</div>`;

  document.getElementById("content").innerHTML = html;
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  if(currentSegment === null){ renderDashboardRoot(); return; }
  const scoped = scopedTraslados();
  const pend = pendientes(scoped);
  const avgDias = pend.length ? Math.round(pend.reduce((a,t)=>a+t.dias,0)/pend.length) : 0;

  const pendFiltrado = pend.filter(t=>passesThreshold(t, minDiasDash));
  const pvpTotal = pendFiltrado.reduce((sum,t)=>sum+t.valorMercancia,0);
  const unidadesTotal = pendFiltrado.reduce((sum,t)=>sum+(t.productos||[]).reduce((s,p)=>s+p.cantidad,0),0);
  const transitoFiltrado = scoped.filter(t=>t.estado==='en_transito' && passesThreshold(t, minDiasDash));

  let html = `
    ${segmentTabsHTML()}
    <div class="kpi-grid">
      <div class="kpi">
        <div class="k-label">📦 Sin consolidar</div>
        <div class="k-value">${pendFiltrado.length}</div>
        <div class="k-sub pvp-highlight">$${pvpTotal.toLocaleString('es-CO')}</div>
        <div class="k-sub-units">${unidadesTotal} und</div>
      </div>
      <div class="kpi">
        <div class="k-label">🚚 En tránsito</div>
        <div class="k-value">${transitoFiltrado.length}</div>
        <div class="k-sub up-green">hacia destino</div>
      </div>
      <div class="kpi">
        <div class="k-label">⏱ Prom. días pend.</div>
        <div class="k-value">${avgDias}d</div>
        <div class="k-sub ${avgDias>=10?'up-red':avgDias>=5?'up-amber':'up-green'}">tiempo promedio</div>
      </div>
    </div>
  `;

  html += thresholdChipsHTML('dash');
  html += renderHierarchyExplorer();

  if(drillPath.length === 0){
    html += `
      <div class="section-title">Traslados atrasados <span class="see-all" onclick="showTab('list')">Ver todos ›</span></div>
      <div class="rows-wrap">
    `;
    const filteredAtrasados = [...pendFiltrado].sort((a,b)=>b.dias-a.dias);
    const top3 = filteredAtrasados.slice(0,3);
    html += top3.length ? top3.map(rowItemHTML).join("") : `<div class="empty-note">Ningún traslado en este rango de días 🎉</div>`;
    html += `</div>`;
  }

  document.getElementById("content").innerHTML = html;
}

/* ================= LISTA (todos, compacta) ================= */
function renderList(){
  const scoped = combinedList();
  const alertCount = scoped.filter(t=>t.estado==='pend_consolidar' && t.dias>=10).length;

  document.getElementById("content").innerHTML = `
    <div class="list-sticky">
      <div class="sticky-summary">
        <div class="s-total"><b>${scoped.length}</b> traslados (Tiendas + Administrativo + CEDI)</div>
        <div class="s-alert"><span class="dot-red"></span>${alertCount} en alerta</div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" placeholder="Buscar por ID, tienda o bodega..." oninput="onSearchInput(this.value)">
      </div>
      ${thresholdChipsHTML('list')}
      <div class="sort-row">
        <div class="sort-chip on" id="sortOld" onclick="setSort('old')">Más antiguo primero</div>
        <div class="sort-chip" id="sortNew" onclick="setSort('new')">Más reciente primero</div>
      </div>
    </div>
    <div class="rows-wrap" id="rowsWrap"></div>
  `;
  updateRows();
}

/* ================= BODEGA (interacción con destino) ================= */
function renderBodega(){
  const scoped = scopedTraslados();
  const all = scoped.filter(t => t.destino === currentBodega);
  const filtradosUmbral = all.filter(t => passesThreshold(t, minDiasDash));
  const pend = filtradosUmbral.filter(t => t.estado === "pend_consolidar");
  const alertas = pend.filter(t => t.dias >= 10).length;
  const avgDias = pend.length ? Math.round(pend.reduce((a,t)=>a+t.dias,0)/pend.length) : 0;

  document.getElementById("content").innerHTML = `
    <div class="back-row" onclick="showTab('dash')">
      <span style="color:var(--lime); font-size:16px;">&#8592;</span>
      <span>Volver al dashboard</span>
    </div>

    <div class="bodega-hero">
      <div class="b-name">${currentBodega}</div>
      <div class="b-sub">Bodega destino · ${all.length} traslados en tu alcance</div>
      <div class="bodega-mini-grid">
        <div class="bodega-mini"><div class="m-val">${pend.length}</div><div class="m-lbl">Sin consolidar</div></div>
        <div class="bodega-mini"><div class="m-val" style="color:${alertas>0?'var(--red)':'var(--text)'}">${alertas}</div><div class="m-lbl">En alerta</div></div>
        <div class="bodega-mini"><div class="m-val">${avgDias}d</div><div class="m-lbl">Prom. días</div></div>
      </div>
    </div>

    <div class="list-sticky" style="padding-top:0;">
      <div class="sort-row">
        <div class="sort-chip on" id="sortOld" onclick="setSort('old')">Más antiguo primero</div>
        <div class="sort-chip" id="sortNew" onclick="setSort('new')">Más reciente primero</div>
      </div>
    </div>
    <div class="section-title">Traslados hacia esta bodega</div>
    <div class="rows-wrap" id="rowsWrap"></div>
  `;
  updateRowsBodega();
}

function updateRows(){
  const scoped = combinedList();
  const filtered = getFilteredSorted(scoped, minDiasList);
  const wrap = document.getElementById("rowsWrap");
  if(!wrap) return;
  wrap.innerHTML = filtered.length ? filtered.map(rowItemHTML).join("") : `<div class="empty-note">Sin resultados para tu búsqueda.</div>`;
}

function updateRowsBodega(){
  const scoped = scopedTraslados().filter(t => t.destino === currentBodega);
  const filtered = getFilteredSorted(scoped, minDiasDash);
  const wrap = document.getElementById("rowsWrap");
  if(!wrap) return;
  wrap.innerHTML = filtered.length ? filtered.map(rowItemHTML).join("") : `<div class="empty-note">Sin traslados para esta bodega.</div>`;
}

/* ================= DETALLE ================= */
function renderDetail(){
  const t = TRASLADOS.concat(TRASLADOS_ADMIN, TRASLADOS_CEDI).find(x => x.id === currentDetailId) || scopedTraslados()[0];
  if(!t){ document.getElementById("content").innerHTML = `<div class="empty-note">Selecciona un traslado desde la lista.</div>`; return; }

  let timelineHTML = "";
  t.etapas.forEach(e => {
    const cls = e.done ? "done" : (e.current ? "current" : "pending");
    const dotContent = e.done ? "✓" : (e.current ? "●" : "");
    timelineHTML += `
      <div class="tl-item ${cls}">
        <div class="tl-dot">${dotContent}</div>
        <div class="tl-line"></div>
        <div class="tl-title">${e.n}</div>
        <div class="tl-meta">${e.loc}<br>${e.fecha}${e.resp!=="—" ? " · " + e.resp : ""}</div>
        ${e.current ? `<span class="tl-status wait">En espera de acción</span>` : ""}
      </div>
    `;
  });

  const alertHTML = t.estado === "pend_consolidar" && t.dias >= 10 ? `
    <div class="alert-box">
      <div class="a-icon">⚠</div>
      <div class="a-text"><b>${t.dias} días</b> sin consolidarse en ${t.destino}. Este traslado supera el tiempo habitual de gestión.</div>
    </div>
  ` : "";

  const productosHTML = (t.productos || []).map(p => `
    <div class="prod-row">
      <div class="prod-sku">${p.sku}</div>
      <div class="prod-nombre">${p.nombre}</div>
      <div class="prod-cant">${p.cantidad} u.</div>
    </div>
  `).join("");

  const ubicacionHTML = t.regional ? `
        <div><div class="lbl">Regional</div><div class="val">${t.regional}</div></div>
        <div><div class="lbl">Ciudad</div><div class="val">${t.ciudad}</div></div>
        <div><div class="lbl">Zona (Jefe)</div><div class="val">${t.zona}</div></div>
  ` : `
        <div><div class="lbl">Ciudad</div><div class="val">${t.ciudad}</div></div>
        <div><div class="lbl">Coordinación</div><div class="val">${t.coordinacion}</div></div>
  `;

  document.getElementById("content").innerHTML = `
    <div class="back-row" onclick="showTab(previousTab)">
      <span style="color:var(--lime); font-size:16px;">&#8592;</span>
      <span>Volver</span>
    </div>

    <div class="detail-card">
      <div class="detail-route">${t.origen} → ${t.destino}</div>
      <div class="detail-sub">${t.id} · ${t.tipo}</div>
      <div class="detail-grid">
        <div><div class="lbl">Estado</div><div class="val">${estadoLabel(t)}</div></div>
        <div><div class="lbl">Paquetes</div><div class="val">${t.paquetes}</div></div>
        ${ubicacionHTML}
        <div><div class="lbl">Transportadora</div><div class="val">${t.transportadora}</div></div>
        <div><div class="lbl">Placa</div><div class="val">${t.placa}</div></div>
        <div><div class="lbl">Valor mercancía</div><div class="val">$${t.valorMercancia.toLocaleString('es-CO')}</div></div>
        <div style="grid-column:1/-1;"><div class="lbl">Motivo</div><div class="val">${t.motivo}</div></div>
      </div>
      <button class="ver-detalle-btn" onclick="toggleContenido()">📦 Ver detalle <span id="contenidoChevron">›</span></button>
      <div id="contenidoPanel" class="contenido-panel" style="display:none;">
        <div class="prod-header">
          <div>SKU</div><div>Referencia</div><div>Cant.</div>
        </div>
        ${productosHTML}
      </div>
    </div>

    <div class="section-title">Trazabilidad</div>
    <div class="detail-card">
      <div class="timeline">
        ${timelineHTML}
      </div>
    </div>

    ${alertHTML}
  `;
}

function render(){
  updateTabsUI();
  if(currentTab === "dash") renderDashboard();
  else if(currentTab === "list") renderList();
  else if(currentTab === "bodega") renderBodega();
  else renderDetail();
}

updateTabsUI();
render();
</script>
</body>
</html>
